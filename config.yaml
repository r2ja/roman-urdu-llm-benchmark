# Roman Urdu LLM Benchmark configuration.
# Model IDs are OpenRouter slugs. Comment/uncomment to control the matrix.

# ---- Contestants: the models under test (Qwen spine + anchors) ----
models:
  # Qwen series, small -> large (the core request)
  - id: qwen/qwen-2.5-7b-instruct
    alias: qwen2.5-7b
  - id: qwen/qwen-2.5-72b-instruct
    alias: qwen2.5-72b
  # Uncomment as you widen the sweep / as OpenRouter exposes them:
  # - { id: qwen/qwen3-14b, alias: qwen3-14b }
  # - { id: qwen/qwen3-32b, alias: qwen3-32b }
  # - { id: meta-llama/llama-3.3-70b-instruct, alias: llama3.3-70b }
  # - { id: google/gemma-3-27b-it, alias: gemma3-27b }

# ---- Judge: held OUT of the contestant pool to avoid self-preference ----
judge:
  id: openai/gpt-5                 # a SOTA model that reliably knows Roman Urdu
  temperature: 0.0
  # If gpt-5 is unavailable on your OpenRouter plan, anthropic/claude-* also works.

# ---- Generation defaults for contestants ----
generation:
  temperature: 0.2
  max_tokens: 512
  # per-model concurrency handled by the runner; keep modest to respect rate limits
  max_concurrency: 4

# ---- Tasks to run ----
tasks:
  - name: sentiment           # NLU: deterministic macro-F1
    type: classification
    dataset: datasets/sentiment_sample.jsonl
    metric: macro_f1

  - name: generation          # NLG: judge-led + guardrails
    type: generation
    dataset: datasets/seed_generation.jsonl
    metrics: [judge, chrf, marker_penalty, language_confusion]

  # - name: transliteration   # add once you wire RUP/Dakshina
  #   type: generation
  #   dataset: datasets/transliteration.jsonl
  #   metrics: [chrf, char_bleu, marker_penalty]

markers: datasets/markers/pakistani_markers.yaml
